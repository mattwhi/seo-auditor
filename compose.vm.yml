services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  web:
    ports: !override
      - "3012:3000"
  api:
    ports: !override
      - "4012:4000"
  worker:
    environment:
      PERFORMANCE_ENABLED: ${PERFORMANCE_ENABLED:-false}
      PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
      PERFORMANCE_MAX_PAGES: ${PERFORMANCE_MAX_PAGES:-4}
