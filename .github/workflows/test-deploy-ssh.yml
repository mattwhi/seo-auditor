
name: Test Docker VM SSH

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ssh:
    name: Verify Docker VM connection
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify known_hosts configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail

          echo "Checking configured SSH host key..."

          if [ "$DEPLOY_PORT" = "22" ]; then
            HOST_LOOKUP="$DEPLOY_HOST"
          else
            HOST_LOOKUP="[$DEPLOY_HOST]:$DEPLOY_PORT"
          fi

          if ssh-keygen -F "$HOST_LOOKUP" \
            -f ~/.ssh/known_hosts >/dev/null; then
            echo "Host key entry found."
          else
            echo "::error::No matching host key entry in DEPLOY_KNOWN_HOSTS"
            exit 1
          fi

      - name: Test SSH connection
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'echo "SSH connection successful"; hostname; whoami; test -d /opt/seo-auditor && echo "SEO Auditor directory found"'
