
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @seo-auditor/database db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate deployment script
        run: |
          set -euo pipefail
          bash -n deploy-ghcr.sh

      - name: Validate Compose configuration
        run: |
          set -euo pipefail

          printf '%s\n' \
            'DATABASE_URL=postgresql://seo:seo@postgres:5432/seo_auditor' \
            'POSTGRES_USER=seo' \
            'POSTGRES_PASSWORD=seo' \
            'POSTGRES_DB=seo_auditor' \
            'REDIS_URL=redis://redis:6379' \
            'WORDPRESS_CREDENTIAL_ENCRYPTION_KEY=ci-validation-only-not-for-production' \
            > .env

          trap 'rm -f .env' EXIT

          docker compose \
            -f docker-compose.yml \
            config --quiet

          grep -q 'SEO_AUDITOR_SECRET_DIR' compose.production.yml
          grep -Fq '.runtime/secrets:/app/.runtime/secrets' compose.production.yml

  publish:
    name: Build and publish Docker image
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/mattwhi/seo-auditor:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy SEO Auditor
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15

    concurrency:
      group: seo-auditor-production
      cancel-in-progress: false

    permissions:
      contents: read

    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Validate deployment files
        run: |
          set -euo pipefail

          test -s deploy-ghcr.sh
          test -s compose.production.yml
          test -s docker-compose.yml

          bash -n deploy-ghcr.sh

          grep -q -- '--env-file .env.production' deploy-ghcr.sh
          grep -q -- '-f compose.production.yml' deploy-ghcr.sh

          echo "Deployment files validated."

      - name: Upload deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          scp \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -P "$DEPLOY_PORT" \
            deploy-ghcr.sh \
            compose.production.yml \
            docker-compose.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/seo-auditor/"

      - name: Validate production VM configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'bash -s' <<'REMOTE'
          set -euo pipefail

          cd /opt/seo-auditor

          bash -n deploy-ghcr.sh

          test -s .env.production
          test -s .runtime/secrets/wordpress-credential.key

          chmod 700 deploy-ghcr.sh
          chmod 700 .runtime/secrets

          echo "Production deployment script validated."
          echo "Persistent encryption key exists."
          echo "Production environment file exists."
          REMOTE

      - name: Deploy validated image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "/opt/seo-auditor/deploy-ghcr.sh sha-$COMMIT_SHA"

      - name: Deployment completed
        run: |
          echo "SEO Auditor deployment completed."
          echo "Image: ghcr.io/mattwhi/seo-auditor:sha-${{ github.sha }}"
