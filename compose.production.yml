# Production security overlay. Add LAST in the Compose -f chain.
services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${SEO_AUDITOR_DB_PASSWORD:?Set the production PostgreSQL password}

  redis:
    ports: !reset []

  api:
    ports: !override
      - '127.0.0.1:4012:4000'
    environment:
      DATABASE_URL: ${SEO_AUDITOR_PRODUCTION_DATABASE_URL:?Set the production database connection URL}

  worker:
    environment:
      DATABASE_URL: ${SEO_AUDITOR_PRODUCTION_DATABASE_URL:?Set the production database connection URL}

  web:
    environment:
    ports: !override
      - '127.0.0.1:3012:3000'
    environment:
      DATABASE_URL: ${SEO_AUDITOR_PRODUCTION_DATABASE_URL:?Set the production database connection URL}

  migrate:
    environment:
      DATABASE_URL: ${SEO_AUDITOR_PRODUCTION_DATABASE_URL:?Set the production database connection URL}
    command: ['pnpm', '--filter', '@seo-auditor/database', 'exec', 'prisma', 'migrate', 'deploy']